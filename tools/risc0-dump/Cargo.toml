[package]
name = "risc0-dump"
version = "0.1.0"
edition = "2021"
publish = false
description = "Dumps a RISC0 Groth16 Receipt (BN254 inner) into the three snarkjs JSON files consumed by bls-snark (Go)."

[[bin]]
name = "risc0-dump"
path = "src/main.rs"

[dependencies]
risc0-zkvm                = { version = "=3.0.5", default-features = false, features = ["std"] }
risc0-groth16             = "=3.0.4"
risc0-circuit-recursion   = "=4.0.4"
risc0-zkp                 = { version = "=3.0.4", default-features = false, features = ["std"] }
risc0-binfmt              = "=3.0.4"

ark-bn254     = "0.5"
ark-ff        = "0.5"
ark-serialize = "0.5"
ark-groth16   = { version = "=0.5.0", default-features = false }

bincode    = "1.3"
serde_json = "1"
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
hex        = "0.4"
num-bigint = "0.4"
